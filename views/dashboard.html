<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shift Swap Dashboard</title>
  <link rel="stylesheet" href="/assets/dashboard.css">
  <script src="/assets/dashboard.js" defer></script>
</head>
<body>
  <header class="page-header">
    <h1 id="greeting">Hello!</h1>
    <a class="sign-out" href="/logout">Sign out</a>
  </header>

  <main class="dashboard">
    <section class="stats-grid">
      <article class="stat-card">
        <p class="stat-label">Open requests</p>
        <h2 id="total-open">0</h2>
      </article>

      <article class="stat-card">
        <p class="stat-label">Approved</p>
        <h2 id="approved-count">0</h2>
      </article>

      <article class="stat-card">
        <p class="stat-label">Pending review</p>
        <h2 id="pending-count">0</h2>
      </article>
    </section>

    <section class="card">
      <div class="card-header">
        <div>
          <p class="section-kicker">Overview</p>
          <h3>Shift swap activity</h3>
        </div>
        <button class="primary-btn" type="button">Request swap</button>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Requesting employee</th>
              <th>Offering employee</th>
              <th>Requesting off</th>
              <th>Requesting on</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody id="swap-table-body"></tbody>
        </table>
      </div>
      <p id="requests-message" role="status" aria-live="polite">Loading shift swaps…</p>
    </section>
  </main>
</body>
</html>
