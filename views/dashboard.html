<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shift Swap Dashboard</title>
  <link rel="stylesheet" href="/assets/dashboard.css">
</head>
<body>
  <header class="page-header">
    <h1 id="greeting">Hello!</h1>
    <a class="sign-out" href="/logout">Sign out</a>
  </header>

  <main class="dashboard">
    <section class="stats-grid">
      <article class="stat-card">
        <p class="stat-label">Open requests</p>
        <h2 id="total-open">0</h2>
      </article>

      <article class="stat-card">
        <p class="stat-label">Approved</p>
        <h2 id="approved-count">0</h2>
      </article>

      <article class="stat-card">
        <p class="stat-label">Pending review</p>
        <h2 id="pending-count">0</h2>
      </article>
    </section>

    <section class="card">
      <div class="card-header">
        <div>
          <p class="section-kicker">Overview</p>
          <h3>Shift swap activity</h3>
        </div>
        <button class="primary-btn">Request swap</button>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Employee</th>
              <th>Current shift</th>
              <th>Desired shift</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody id="swap-table-body"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script>
    const requests = [
      {
        employee: 'Ava Johnson',
        currentShift: 'Mon 7:00 AM – 3:00 PM',
        desiredShift: 'Tue 3:00 PM – 11:00 PM',
        status: 'Approved'
      },
      {
        employee: 'Marcus Lee',
        currentShift: 'Wed 11:00 AM – 7:00 PM',
        desiredShift: 'Thu 7:00 AM – 3:00 PM',
        status: 'Pending'
      },
      {
        employee: 'Nina Patel',
        currentShift: 'Fri 3:00 PM – 11:00 PM',
        desiredShift: 'Sat 7:00 AM – 3:00 PM',
        status: 'Rejected'
      },
      {
        employee: 'Daniel Kim',
        currentShift: 'Sun 7:00 AM – 3:00 PM',
        desiredShift: 'Mon 3:00 PM – 11:00 PM',
        status: 'Pending'
      }
    ];

    function badgeClass(status) {
      switch (status.toLowerCase()) {
        case 'approved':
          return 'badge-approved';
        case 'pending':
          return 'badge-pending';
        case 'rejected':
          return 'badge-rejected';
        default:
          return 'badge-neutral';
      }
    }

    function renderTable() {
      const tbody = document.querySelector('#swap-table-body');

      tbody.innerHTML = requests.map((request) => `
        <tr>
          <td>${request.employee}</td>
          <td>${request.currentShift}</td>
          <td>${request.desiredShift}</td>
          <td><span class="badge ${badgeClass(request.status)}">${request.status}</span></td>
        </tr>
      `).join('');

      const totalOpen = requests.length;
      const approvedCount = requests.filter(r => r.status === 'Approved').length;
      const pendingCount = requests.filter(r => r.status === 'Pending').length;

      document.querySelector('#total-open').textContent = totalOpen;
      document.querySelector('#approved-count').textContent = approvedCount;
      document.querySelector('#pending-count').textContent = pendingCount;
    }

    fetch('/me')
      .then((response) => {
        if (!response.ok) throw new Error('Sign-in required');
        return response.json();
      })
      .then((user) => {
        document.querySelector('#greeting').textContent = `Hello, ${user.name}`;
      })
      .catch(() => {
        window.location.href = '/';
      });

    renderTable();
  </script>
</body>
</html>
