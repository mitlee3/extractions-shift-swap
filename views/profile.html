<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Complete your profile · Shift Swap</title>
  <link rel="stylesheet" href="/assets/dashboard.css">
  <style>
    .profile-form { max-width: 640px; margin: 2rem auto; padding: 2rem; }
    .profile-form label { display: block; margin: 1rem 0 .4rem; font-weight: 600; }
    .profile-form input, .profile-form select { box-sizing: border-box; width: 100%; padding: .7rem; font: inherit; }
    .profile-form select[multiple] { min-height: 10rem; }
    .profile-form button { margin-top: 1.5rem; }
    #form-error { color: #a12622; }
  </style>
  <script src="/assets/profile.js" defer></script>
</head>
<body>
  <header class="page-header">
    <h1>Complete your profile</h1>
    <a class="sign-out" href="/logout">Sign out</a>
  </header>
  <main class="card profile-form">
    <p>We couldn't find an account for your signed-in email. Complete your work profile to continue.</p>
    <form id="profile-form">
      <label for="first-name">First name</label>
      <input id="first-name" name="firstName" autocomplete="given-name" maxlength="100" required>

      <label for="last-name">Last name</label>
      <input id="last-name" name="lastName" autocomplete="family-name" maxlength="100" required>

      <label for="position">Position</label>
      <select id="position" name="position" required></select>

      <label for="shift-days">Shift days (select all that apply)</label>
      <select id="shift-days" name="shiftDays" multiple required></select>

      <label for="shift-number">Shift number</label>
      <select id="shift-number" name="shiftNumber" required></select>

      <p>Account creation time is recorded automatically by the database.</p>
      <p id="form-error" role="alert" hidden></p>
      <button class="primary-btn" type="submit">Save profile and continue</button>
    </form>
  </main>
</body>
</html>
