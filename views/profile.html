<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shift Swap · Profile</title>
  <link rel="stylesheet" href="/assets/dashboard.css">
  <script src="/assets/profile.js" defer></script>
</head>
<body>
  <header class="page-header">
    <div><p class="section-kicker" id="profile-kicker">New profile</p><h1 id="profile-title">Complete your profile</h1></div>
    <a class="sign-out" href="/logout">Sign out</a>
  </header>
  <div class="app-layout">
    <aside class="sidebar" aria-label="Main navigation">
      <p class="sidebar-label">Navigation</p>
      <a class="sidebar-link" href="/dashboard">Shift swaps</a>
      <a class="sidebar-link active" id="profile-nav-link" href="/profile/update" aria-current="page">Update profile</a>
    </aside>
    <main class="profile-layout">
      <section class="card profile-form">
        <p class="profile-intro" id="profile-intro">Please add the details to complete your profile.</p>
        <p class="availability-message" id="availability-message" role="status" aria-live="polite" hidden></p>
        <form id="profile-form">
          <div class="form-grid">
            <div><label for="first-name">First name</label><input id="first-name" name="firstName" autocomplete="given-name" maxlength="100" required></div>
            <div><label for="last-name">Last name</label><input id="last-name" name="lastName" autocomplete="family-name" maxlength="100" required></div>
            <div><label for="position">Position</label><select id="position" name="position" required></select></div>
            <div><label for="shift-number">Shift number</label><select id="shift-number" name="shiftNumber" required></select></div>
          </div>
          <fieldset><legend>Shift days</legend><div id="shift-days" class="day-grid"></div></fieldset>
          <p id="form-error" class="form-error" role="alert" hidden></p>
          <button class="primary-btn" id="profile-submit" type="submit">Save profile and continue</button>
        </form>
      </section>
    </main>
  </div>
</body>
</html>
