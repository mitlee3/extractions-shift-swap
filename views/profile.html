<!doctype html>
<html lang="en">
<head>
  <!-- Set the page encoding, responsive viewport, title, shared styles, and profile script. -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shift Swap · Complete profile</title>
  <link rel="stylesheet" href="/assets/dashboard.css">
  <script src="/assets/profile.js" defer></script>
</head>
<body>
  <!-- Provide page context and a sign-out link. -->
  <header class="page-header">
    <div><p class="section-kicker">New profile</p><h1>Complete your profile</h1></div>
    <a class="sign-out" href="/logout">Sign out</a>
  </header>

  <!-- Collect fields corresponding to User and the normalized schedule tables. -->
  <main class="profile-layout">
    <section class="card profile-form">
      <p class="profile-intro">Please add the details to complete your profile.</p>
      <form id="profile-form">
        <div class="form-grid">
          <div><label for="first-name">First name</label><input id="first-name" name="firstName" autocomplete="given-name" maxlength="100" required></div>
          <div><label for="last-name">Last name</label><input id="last-name" name="lastName" autocomplete="family-name" maxlength="100" required></div>
          <div><label for="position">Position</label><select id="position" name="position" required></select></div>
          <div><label for="shift-number">Shift number</label><select id="shift-number" name="shiftNumber" required></select></div>
        </div>
        
        <!-- Weekday checkboxes map to UserScheduleDays.day_of_week values from 0 to 6. -->
        <fieldset><legend>Recurring shift days</legend><div id="shift-days" class="day-grid"></div></fieldset>
        <!-- Display accessible validation feedback and submit profile data. -->
        <p id="form-error" class="form-error" role="alert" hidden></p>
        <button class="primary-btn" type="submit">Save profile and continue</button>
        
      </form>
    </section>
  </main>
</body>
</html>
